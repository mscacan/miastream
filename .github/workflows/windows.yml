name: Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Pack one portable exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $seven = "C:\Program Files\7-Zip\7z.exe"
          $release = Join-Path $env:GITHUB_WORKSPACE "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path pack | Out-Null
          & $seven a -mx=5 pack\payload.7z "$release\*"
          Invoke-WebRequest -Uri "https://github.com/ip7z/7zip/releases/download/24.09/7z2409-extra.7z" -OutFile pack\extra.7z
          & $seven x pack\extra.7z -opack\extra -y
          $sfx = Get-ChildItem -Recurse pack\extra -Filter 7zSD.sfx | Select-Object -First 1
          if (-not $sfx) { throw "7zSD.sfx not found" }
          $config = ";!@Install@!UTF-8!`nTitle=`"Mia Stream`"`nGUIMode=`"2`"`nInstallPath=`"%LOCALAPPDATA%\MiaStream`"`nRunProgram=`"miastream.exe`"`n;!@InstallEnd@!`n"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$pwd\pack\config.txt", $config, $utf8)
          cmd /c "copy /b `"$($sfx.FullName)`" + pack\config.txt + pack\payload.7z pack\MiaStream.exe"
          if (-not (Test-Path pack\MiaStream.exe)) { throw "portable exe was not created" }
          tar -a -c -f miastreamexe.zip -C pack MiaStream.exe

      - uses: actions/upload-artifact@v4
        with:
          name: miastreamexe
          path: miastreamexe.zip
          if-no-files-found: error
